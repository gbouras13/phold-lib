[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel>=0.37.1"]

[project]
name = "pholdlib"
version = "0.3.0"
description = "Shared ProstT5 and ModernProst 3Di/12-state inference library for phold and baktfold"
readme = "README.md"
requires-python = ">=3.8, <4"
license = {file = "MIT"}
authors = [
    {name = "George Bouras", email = "george.bouras@adelaide.edu.au"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "loguru >=0.5.3",
    "requests >=2.25",
    "sentencepiece >=0.1.99",
    "protobuf >=3.20",
    # >=4.51: the -pssm ModernProst checkpoints import their config inside a
    # try/except. transformers <4.51 scans custom code for imports with a
    # regex that strips the try body but not the except body, sees
    # `from configuration_modernprost_3di12st import ...` and refuses to load
    # ("requires ... configuration_modernprost_3di12st"). 4.51 parses with
    # `ast` and skips try/except blocks.
    "transformers >=4.51",
    "torch >=2.1.2",
    # Loosened from `>=2.0` to `>=1.24` so consumer projects (phold,
    # baktfold) installed in environments with Debian-managed numpy
    # 1.26.x (e.g. the pawsey/pytorch ROCm Docker base image) don't
    # trigger pip's "Cannot uninstall numpy: RECORD file not found"
    # error. pholdlib only uses the stable numeric API; the only
    # numpy-2.x divergence (np.float32 vs Python float on round) is
    # explicitly neutralised by the `float(...)` cast in
    # prostt5/inference.py.
    "numpy >=1.24",
    "h5py >=3.5",
    "tqdm >=4.35.0",
    "alive-progress >=3.0.1",
]

[project.urls]
"Homepage" = "https://github.com/gbouras13/phold-lib"

[project.optional-dependencies]
lint = ["isort", "black"]
test = ["pytest>=6.2.5", "pytest-cov >=3.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
