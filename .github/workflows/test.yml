name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      # Cache the HuggingFace ProstT5 model (~1.6 GB fp16).
      # The key is fixed to the model name so it is shared across all matrix
      # entries and only downloaded once (on the very first CI run).
      - name: Cache ProstT5 model
        uses: actions/cache@v4
        with:
          path: tests/test_data/model_cache
          key: prostt5-fp16-${{ runner.os }}

      # Install the CPU-only PyTorch wheel first so the full ~2 GB CUDA wheel
      # is never downloaded on CI.  The package installer sees torch is already
      # satisfied and skips it.
      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install pholdlib + test dependencies
        run: pip install -e ".[test]"

      # Unit tests + integration tests.
      # --run_integration triggers the full ProstT5 + CNN pipeline tests.
      # ProstT5 is downloaded to tests/test_data/model_cache/ on first run
      # and restored from the Actions cache on all subsequent runs.
      - name: Run tests
        run: pytest tests/ -v --tb=short --run_integration
